<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;

.card{max-width:440px;width:100%;text-align:center;

.rule{width:48px;height:2px;background:#c9a465;margin:26px auto}

a.btn{display:block;text-decoration:none;padding:16px;border-radius:100px;font-weight:500;

a.jp{background:#c9a465;color:#1c1710}
a.en{background:transparent;color:#f4ece0;border:1px solid rgba(244,236,224,.45)}

    <div class="btns">
